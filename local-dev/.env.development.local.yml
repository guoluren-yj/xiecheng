# 本地反代 / SSO 开发配置模板
# 复制到：src/config/.env.development.local.yml
#   Windows: copy local-dev\.env.development.local.yml src\config\.env.development.local.yml
#   macOS:   cp local-dev/.env.development.local.yml src/config/.env.development.local.yml
#
# 目的：authorize 与 /oauth/saml/SSO 同域，避免 AuthnRequest 会话 Cookie 丢在 srm-api 上
# 依赖：hosts + yarn proxy:start（见 local-dev/README.md）

LOGIN_URL: http://srm-front.fat0.qa.nt.ctripcorp.com/oauth/oauth/authorize?response_type=token&client_id=localhost
LOGOUT_URL: http://srm-front.fat0.qa.nt.ctripcorp.com/oauth/logout

# 必须把 LOGIN_URL 暴露给浏览器（覆盖 development 列表并追加 LOGIN_URL）
CLIENT_ENV_LIST:
  - BASE_PATH
  - PLATFORM_VERSION
  - API_HOST
  - WEBSOCKET_HOST
  - PUBLIC_URL
  - IM_ENABLE
  - IM_WEBSOCKET_HOST
  - TRACE_LOG_ENABLE
  - CUSTOMIZE_ICON_NAME
  - MULTIPLE_SKIN_ENABLE
  - PACKAGE_PUBLIC_URL
  - HELP_ROBOTR_URL
  - HELP_ROBOTR_URL_ONLINE
  - YQCLOUD_HOST
  - GJSC_HOST
  - HSCF_HOST
  - SRC_WEBSOCKET_HOST
  - SRM_MALL_HOST
  - SRM_AMKT_HOST
  - PUBLIC_BUCKET
  - PRIVATE_BUCKET
  - ENV_NAME
  - HELPROBOT_WECHAT_ICON
  - LOGOUT_URL
  - LOGIN_URL
  - REPET_FIELD_WARNING
  - AUTO_LOGOUT_METHOD
